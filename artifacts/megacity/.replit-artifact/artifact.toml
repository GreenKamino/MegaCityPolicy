kind = "mobile"
previewPath = "/"
title = "MegaCity: Sector Marshal"
version = "1.0.0"
id = "artifacts/megacity"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 20017
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/megacity run dev"

[services.env]
PORT = "20017"
BASE_PATH = "/"
CI = "true"

[services.production]
build = ["pnpm", "--filter", "@workspace/megacity", "run", "build"]
run = ["pnpm", "--filter", "@workspace/megacity", "run", "serve"]
